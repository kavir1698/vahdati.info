<header>
  <div class="container">
    <div class="header-content">
      <a href="{{site.url}}{{site.baseurl}}/" class="logo">Farhad Vahdati</a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span>☰</span>
      </button>

      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="{{site.url}}{{site.baseurl}}/" class="active">Home</a></li>
          <li><a href="{{site.url}}{{site.baseurl}}/experience">Experience</a></li>
          <li><a href="{{site.url}}{{site.baseurl}}/projects">Projects</a></li>
          <li><a href="{{site.url}}{{site.baseurl}}/publications">Publications</a></li>
          <li><a href="{{site.url}}{{site.baseurl}}/teaching">Teaching</a></li>
          <li><a href="{{site.url}}{{site.baseurl}}/software">Software</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const navToggle = document.getElementById('navToggle');
  const navMenu = document.getElementById('navMenu');

  // Toggle mobile menu
  navToggle.addEventListener('click', function() {
    navMenu.classList.toggle('active');
  });

  // Close menu when clicking outside
  document.addEventListener('click', function(event) {
    if (!navToggle.contains(event.target) && !navMenu.contains(event.target)) {
      navMenu.classList.remove('active');
    }
  });

  // Handle active state for navigation
  const currentPath = window.location.pathname;
  const navLinks = document.querySelectorAll('.nav-menu a');

  navLinks.forEach(link => {
    // Remove active class from all links
    link.classList.remove('active');

    // Add active class to current page link
    const linkPath = new URL(link.href).pathname;
    if (linkPath === currentPath || (currentPath === '/' && linkPath === '')) {
      link.classList.add('active');
    }
  });
});
</script>
